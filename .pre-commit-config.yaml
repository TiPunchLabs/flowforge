# Install once:  pre-commit install
# Run manually:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Requires the terraform binary on PATH.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      # Runs `terraform init -backend=false` then `terraform validate` per directory.
      - id: terraform_validate

  # Built with Go by pre-commit (toolchain downloaded if missing). Uses shellcheck if on PATH.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Iterator result rules and review-cycle gates, run against the real workflow step scripts.
  # Requires bash, git, jq and yq (mikefarah v4) on PATH, as on GitHub-hosted runners.
  - repo: local
    hooks:
      - id: iterator-partial-delivery
        name: iterator partial delivery tests
        entry: tests/iterator-partial-delivery.sh
        language: script
        pass_filenames: false
        files: ^(\.github/workflows/(agent-iterate|review-cycle)\.yml|tests/iterator-partial-delivery\.sh)$
      # Closed / merged pull request = NO_OP (Issue #18): Reviewer state gates and cycle result.
      - id: review-no-op
        name: review no-op tests
        entry: tests/review-no-op.sh
        language: script
        pass_filenames: false
        files: ^(\.github/workflows/(agent-review|review-cycle)\.yml|tests/review-no-op\.sh)$
      # Issue label lifecycle (Issue #19): one FlowForge state label, idempotent transitions.
      - id: label-lifecycle
        name: label lifecycle tests
        entry: tests/label-lifecycle.sh
        language: script
        pass_filenames: false
        files: ^(\.github/(workflows/(agent-develop|review-cycle|agent-lifecycle)\.yml|scripts/flowforge-state\.sh)|examples/target-repository/flowforge-lifecycle\.yml|terraform/modules/target-repository/variables\.tf|tests/label-lifecycle\.sh)$
