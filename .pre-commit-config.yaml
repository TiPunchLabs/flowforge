# Install once:  pre-commit install
# Run manually:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Requires the terraform binary on PATH.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      # Runs `terraform init -backend=false` then `terraform validate` per directory.
      - id: terraform_validate

  # Built with Go by pre-commit (toolchain downloaded if missing). Uses shellcheck if on PATH.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Iterator result rules and review-cycle gates, run against the real workflow step scripts.
  # Requires bash, git, jq and yq (mikefarah v4) on PATH, as on GitHub-hosted runners.
  - repo: local
    hooks:
      - id: iterator-partial-delivery
        name: iterator partial delivery tests
        entry: tests/iterator-partial-delivery.sh
        language: script
        pass_filenames: false
        files: ^(\.github/workflows/(agent-iterate|review-cycle)\.yml|tests/iterator-partial-delivery\.sh)$
      # Closed / merged pull request = NO_OP (Issue #18): Reviewer state gates and cycle result.
      - id: review-no-op
        name: review no-op tests
        entry: tests/review-no-op.sh
        language: script
        pass_filenames: false
        files: ^(\.github/workflows/(agent-review|review-cycle)\.yml|tests/review-no-op\.sh)$
      # Closed / merged pull request = NO_OP for the Iterator (Issue #22): preconditions,
      # last read before the push, cycle result.
      - id: iterate-no-op
        name: iterate no-op tests
        entry: tests/iterate-no-op.sh
        language: script
        pass_filenames: false
        files: ^(\.github/workflows/(agent-iterate|review-cycle)\.yml|tests/iterate-no-op\.sh)$
      # Iterator entry contract and loop bound (Phase 6, Prompt 29.2): iteration ceiling,
      # review_json contract, work list, branch guards, cycle bound, card Review <-> Iteration.
      - id: iterate-preconditions
        name: iterate preconditions tests
        entry: tests/iterate-preconditions.sh
        language: script
        pass_filenames: false
        files: ^(\.github/workflows/(agent-iterate|review-cycle)\.yml|\.github/scripts/flowforge-project\.sh|tests/iterate-preconditions\.sh)$
      # Issue label lifecycle (Issue #19): one FlowForge state label, idempotent transitions.
      - id: label-lifecycle
        name: label lifecycle tests
        entry: tests/label-lifecycle.sh
        language: script
        pass_filenames: false
        files: ^(\.github/(workflows/(agent-develop|review-cycle|agent-lifecycle)\.yml|scripts/flowforge-state\.sh)|examples/target-repository/flowforge-lifecycle\.yml|terraform/modules/target-repository/variables\.tf|tests/label-lifecycle\.sh)$
      # Developer delivery gate (Issue #34): the workflow, not Claude, pushes and opens the PR.
      - id: developer-delivery
        name: developer delivery tests
        entry: tests/developer-delivery.sh
        language: script
        pass_filenames: false
        files: ^(\.github/workflows/agent-develop\.yml|tests/developer-delivery\.sh)$
      # Refiner (Phase 5): result contract, Original request / record rendering, idempotent
      # re-refinement, label mapping, race guard, read-only workflow.
      - id: refiner
        name: refiner tests
        entry: tests/refiner.sh
        language: script
        pass_filenames: false
        files: ^(\.github/(workflows/agent-refine\.yml|scripts/flowforge-(refine|state)\.sh)|examples/target-repository/flowforge-refine\.yml|tests/refiner\.sh)$
      # GitHub Project sync (Phase 6, Prompt 28): decision table, stale guard, idempotence,
      # best-effort errors, real workflow steps, token scope and revoke before Claude.
      - id: project-sync
        name: project sync tests
        entry: tests/project-sync.sh
        language: script
        pass_filenames: false
        files: ^(\.github/(workflows/(agent-develop|agent-refine|agent-iterate|agent-review|review-cycle|agent-lifecycle)\.yml|scripts/flowforge-(project|state)\.sh)|config/github-project\.json|examples/target-repository/.*\.yml|tests/project-sync\.sh)$
      # Notion -> GitHub submission (Phase 7, Prompt 33): page ID input, guards, validation,
      # idempotence and recovery, sanitised body, workflow invariants, Developer bot guard.
      - id: notion-submit
        name: notion submit tests
        entry: tests/notion-submit.sh
        language: script
        pass_filenames: false
        files: ^(\.github/(workflows/(notion-submit|agent-develop)\.yml|scripts/flowforge-notion\.sh)|config/notion(-allowlist)?\.json|tests/notion-submit\.sh)$
      # GitHub -> Notion feedback (Phase 7, Prompt 34): mapping, PR, correlation, injection,
      # idempotence, failures, workflow invariants (credential separation, read-only token).
      - id: notion-sync
        name: notion sync tests
        entry: tests/notion-sync.sh
        language: script
        pass_filenames: false
        files: ^(\.github/(workflows/notion-sync\.yml|scripts/flowforge-notion(-sync)?\.sh)|config/(notion(-allowlist)?|github-project)\.json|examples/target-repository/.*\.yml|tests/notion-sync\.sh)$
      # Default-branch ruleset (human merge gate): `terraform test` with a mocked provider, no GitHub call.
      - id: target-repository-module-test
        name: target-repository module tests
        entry: bash -c 'terraform -chdir=terraform/modules/target-repository init -backend=false -input=false >/dev/null && terraform -chdir=terraform/modules/target-repository test'
        language: system
        pass_filenames: false
        files: ^terraform/modules/target-repository/
