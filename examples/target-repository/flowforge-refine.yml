# Minimal workflow to copy into a TARGET repository as
#   .github/workflows/flowforge-refine.yml
#
# It holds no logic: everything lives in the FlowForge reusable workflow agent-refine.yml.
# Replace OWNER and `@main` with the full commit SHA of a FlowForge version, the same
# in all five callers: `@<40-char SHA> # vX.Y.Z` (docs/target-onboarding.md §10).
#
# Trigger: workflow_dispatch only, started by a human for one Issue:
#   gh workflow run flowforge-refine.yml -f issue_number=<n>
# No `issues` trigger on purpose: refining is an explicit request, never a side effect of
# opening or editing an Issue.
#
# Result: READY or NEEDS_CLARIFICATION rewrite the Issue title and body (original request kept
# verbatim inside it); NEEDS_CLARIFICATION adds agent:needs-clarification; BLOCKED only
# comments. By default (SUPERVISED) the Developer is never started: a human applies
# `agent:ready` after reading.
#
# Controlled autonomy (opt-in, docs/autonomy-contract.md): with the repository variables
# FLOWFORGE_AUTONOMY_MODE=SEMI_AUTO and FLOWFORGE_AUTONOMY_OWNER=<owner login>, managed by the
# target-repository Terraform module, a LOW-risk request opened and dispatched by the owner that
# passes every gate gets `agent:ready` from the workflow, and the `develop` job below starts the
# Developer in the same run; once it delivers the Draft PR, the `review` job reviews it once.
# Unset variables = SUPERVISED. Opt out per Issue: label agent:manual.
#
# Prerequisite: the same CLAUDE_CODE_OAUTH_TOKEN secret as flowforge-agent.yml, and the
# agent:needs-clarification / agent:manual labels (target-repository Terraform module).
name: FlowForge refine

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to refine
        type: number
        required: true

permissions: {}

jobs:
  refine:
    uses: OWNER/flowforge/.github/workflows/agent-refine.yml@main
    # Must cover what the called workflow requests; it can only narrow, never widen.
    #   contents, pull-requests: read   the agent reads the default branch and related PRs
    #   issues: write                   publish job only (Issue title/body, label, comment)
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      # fromJSON: workflow_dispatch inputs reach `inputs` as strings; the input is a number.
      issue_number: ${{ fromJSON(inputs.issue_number) }}
      # GitHub Project sync (opt-in): organization variable, unset = 0 = off. Needs the App (Project only).
      project_number: ${{ fromJSON(vars.FLOWFORGE_PROJECT_NUMBER || '0') }}
      app_client_id: ${{ vars.FLOWFORGE_APP_CLIENT_ID }}
      # Autonomy (repository variables only, never organization-level): unset = SUPERVISED.
      autonomy_mode: ${{ vars.FLOWFORGE_AUTONOMY_MODE || 'SUPERVISED' }}
      autonomy_owner: ${{ vars.FLOWFORGE_AUTONOMY_OWNER }}
    # Explicit, minimal secrets contract: never `secrets: inherit`.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Project sync only; the Refiner agent never receives an App token.
      app_private_key: ${{ secrets.FLOWFORGE_APP_PRIVATE_KEY }}

  # SEMI_AUTO only: runs when the refine run decided AUTO_START and read agent:ready back on the
  # Issue. The same job as flowforge-agent.yml (same reusable workflow, permissions, secrets and
  # inputs: keep both in sync), reached through a second door; agent-develop.yml still requires
  # agent:ready and an absent agent branch. Skipped in SUPERVISED.
  develop:
    needs: refine
    if: needs.refine.outputs.autostart == 'true'
    uses: OWNER/flowforge/.github/workflows/agent-develop.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      issue_number: ${{ fromJSON(inputs.issue_number) }}
      base_branch: ${{ needs.refine.outputs.base_branch }}
      # Project-specific: the same values as in flowforge-agent.yml.
      # setup_uv: true
      # allowed_tools: "Bash(uv sync:*),Bash(uv run pytest:*),Bash(uv run ruff:*)"
      app_client_id: ${{ vars.FLOWFORGE_APP_CLIENT_ID }}
      project_number: ${{ fromJSON(vars.FLOWFORGE_PROJECT_NUMBER || '0') }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app_private_key: ${{ secrets.FLOWFORGE_APP_PRIVATE_KEY }}

  # SEMI_AUTO only: one review of the Draft PR the develop job above delivered, in the same run.
  # The only automatic path to the Reviewer: PR events sent by bots (the App opens the PR) still
  # start no review (flowforge-review.yml). Runs only when develop reports a verified delivery
  # (`head_sha`); agent-review.yml re-checks that exact delivery (branch, Issue, head commit,
  # draft) and skips one already reviewed. Same job as flowforge-review.yml (permissions,
  # inputs, secrets: keep both in sync). APPROVE moves the card to Human validation; merge stays
  # human. REQUEST_CHANGES: dispatch flowforge-review-cycle.yml by hand for the bounded Iterator loop.
  review:
    needs: [refine, develop]
    if: >-
      needs.refine.outputs.autostart == 'true'
      && needs.develop.outputs.head_sha != '' && needs.develop.outputs.pull_request != ''
    uses: OWNER/flowforge/.github/workflows/agent-review.yml@main
    permissions:
      contents: read
      issues: read
      pull-requests: write
      checks: read
      statuses: read
    with:
      pull_request_number: ${{ fromJSON(needs.develop.outputs.pull_request) }}
      expected_head_sha: ${{ needs.develop.outputs.head_sha }}
      expected_head_branch: ${{ needs.develop.outputs.branch }}
      expected_issue_number: ${{ fromJSON(inputs.issue_number) }}
      # Project-specific: the same values as in flowforge-review.yml.
      # setup_uv: true
      # allowed_tools: "Bash(uv sync --locked),Bash(uv run pytest:*),Bash(uv run ruff check .),Bash(uv run ruff format --check .)"
      project_number: ${{ fromJSON(vars.FLOWFORGE_PROJECT_NUMBER || '0') }}
      app_client_id: ${{ vars.FLOWFORGE_APP_CLIENT_ID }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app_private_key: ${{ secrets.FLOWFORGE_APP_PRIVATE_KEY }}
