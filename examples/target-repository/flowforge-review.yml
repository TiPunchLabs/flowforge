# Minimal workflow to copy into a TARGET repository as
#   .github/workflows/flowforge-review.yml
#
# It holds no logic: everything lives in the FlowForge reusable workflow.
# Replace OWNER and pin `@main` to a tag or commit SHA once FlowForge publishes releases.
#
# Triggers (validated by the first Reviewer E2E, see docs/architecture.md §5.1):
# - workflow_dispatch: Draft PRs opened by the Developer with GITHUB_TOKEN do not start
#   `pull_request` workflows on their own (the run waits for approval), so agent PRs are
#   reviewed on demand:
#     gh workflow run flowforge-review.yml -f pull_request_number=<n>
# - pull_request: human activity (push, reopen, ready for review) on an `agent/*` branch
#   of the target repository. Forks and other branches are ignored, and so are runs
#   whose actor is github-actions[bot] (claude-code-action refuses bot actors).
#
# Prerequisite: the same CLAUDE_CODE_OAUTH_TOKEN secret as flowforge-agent.yml.
name: FlowForge review

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to review
        type: number
        required: true
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && startsWith(github.event.pull_request.head.ref, 'agent/')
          && github.actor != 'github-actions[bot]')
    uses: OWNER/flowforge/.github/workflows/agent-review.yml@main
    # Must cover what the called workflow requests; it can only narrow, never widen.
    # Code stays read-only; the only write is the FlowForge comment on the PR.
    permissions:
      contents: read
      issues: read
      pull-requests: write
      checks: read
      statuses: read
    with:
      # fromJSON: workflow_dispatch inputs reach `inputs` as strings; the input is a number.
      pull_request_number: ${{ fromJSON(inputs.pull_request_number || github.event.pull_request.number) }}
      # Project-specific: tooling to install and the NON-DESTRUCTIVE checks the Reviewer may run.
      # setup_uv: true
      # Prefer exact rules: a prefix rule such as "Bash(uv run ruff check:*)" would also allow --fix.
      # allowed_tools: "Bash(uv sync --locked),Bash(uv run pytest:*),Bash(uv run ruff check .),Bash(uv run ruff format --check .)"
    # Explicit, minimal secrets contract: never `secrets: inherit`.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
