# Minimal workflow to copy into a TARGET repository as
#   .github/workflows/flowforge-agent.yml
#
# It holds no logic: everything lives in the FlowForge reusable workflow.
# Replace OWNER and `@main` with the full commit SHA of a FlowForge version, the same
# in all five callers: `@<40-char SHA> # vX.Y.Z` (docs/target-onboarding.md §10).
#
# Prerequisites, visible to this repository (typically organization-level, with
# "Selected repositories" access):
# - secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`);
# - optional, recommended: the FlowForge GitHub App installed on this repository, with
#   variable FLOWFORGE_APP_CLIENT_ID and secret FLOWFORGE_APP_PRIVATE_KEY. The App pushes the
#   agent branch and opens the Draft PR, so this repository's CI runs without manual
#   approval. Without them, GITHUB_TOKEN delivers and every PR run waits for approval.
#   See docs/target-onboarding.md.
# - SPEC.md at the root of the default branch (docs/spec-contract.md): without it, or with
#   an incomplete one, the Developer refuses to start and the Issue keeps agent:ready.
name: FlowForge agent

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  develop:
    if: github.event.label.name == 'agent:ready'
    uses: OWNER/flowforge/.github/workflows/agent-develop.yml@main
    # Must cover what the called workflow requests; it can only narrow, never widen.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      issue_number: ${{ github.event.issue.number }}
      base_branch: ${{ github.event.repository.default_branch }}
      # Project-specific: tooling to install and the commands the agent may run.
      # setup_uv: true
      # allowed_tools: "Bash(uv sync:*),Bash(uv run pytest:*),Bash(uv run ruff:*)"
      app_client_id: ${{ vars.FLOWFORGE_APP_CLIENT_ID }}
      # GitHub Project sync (opt-in): organization variable, unset = 0 = off. Needs the App.
      project_number: ${{ fromJSON(vars.FLOWFORGE_PROJECT_NUMBER || '0') }}
    # Explicit, minimal secrets contract: never `secrets: inherit`.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      app_private_key: ${{ secrets.FLOWFORGE_APP_PRIVATE_KEY }}
